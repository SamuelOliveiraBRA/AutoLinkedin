<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Post LinkedIn</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0a66c2 0%, #004182 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            padding: 40px;
            transition: all 0.3s ease;
        }
        h1 {
            color: #0a66c2;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2rem;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #555;
            font-size: 16px;
        }
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            background-color: #f8f9fa;
            resize: vertical;
            min-height: 200px;
        }
        textarea:focus {
            outline: none;
            border-color: #0a66c2;
            background-color: white;
        }
        button {
            background: #0a66c2;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 20px;
        }
        button:hover {
            background: #004182;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(10, 102, 194, 0.4);
        }
        button:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .char-count {
            text-align: right;
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #0a66c2;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
        }
        .info-box h3 {
            margin-top: 0;
            color: #0a66c2;
            font-size: 16px;
        }
        .info-box p {
            margin-bottom: 0;
            font-size: 14px;
            line-height: 1.5;
        }
        .preview {
            background: #f8f9fa;
            border: 1px solid #e1e5eb;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }
        .preview h4 {
            margin-top: 0;
            color: #0a66c2;
            font-size: 14px;
        }
        .preview-content {
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.5;
        }
        .linkedin-icon {
            width: 24px;
            height: 24px;
            vertical-align: middle;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <svg class="linkedin-icon" viewBox="0 0 24 24" fill="#0a66c2">
                <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
            </svg>
            Gerador de Post LinkedIn
        </h1>
        
        <div class="info-box">
            <h3>📝 Como funciona</h3>
            <p>Digite o texto do seu post abaixo e clique em "Enviar para LinkedIn". O n8n irá processar automaticamente e publicar no seu perfil LinkedIn.</p>
        </div>
        
        <form id="postForm">
            <div class="form-group">
                <label for="postText">Texto do Post *</label>
                <textarea 
                    id="postText" 
                    name="postText" 
                    required 
                    placeholder="Digite aqui o texto que será publicado no seu LinkedIn..."
                    maxlength="3000"
                ></textarea>
                <div class="char-count">
                    <span id="charCount">0</span> / 3000 caracteres
                </div>
            </div>
            
            <div class="preview" id="preview">
                <h4>📱 Preview do Post:</h4>
                <div class="preview-content" id="previewContent"></div>
            </div>
            
            <button type="submit" id="enviarBtn">
                Enviar para LinkedIn
            </button>
        </form>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('postForm');
            const enviarBtn = document.getElementById('enviarBtn');
            const statusDiv = document.getElementById('status');
            const postTextarea = document.getElementById('postText');
            const charCount = document.getElementById('charCount');
            const preview = document.getElementById('preview');
            const previewContent = document.getElementById('previewContent');
            
            // Atualizar contador de caracteres e preview
            postTextarea.addEventListener('input', function() {
                const currentLength = this.value.length;
                charCount.textContent = currentLength;
                
                // Atualizar cor do contador
                if (currentLength > 2800) {
                    charCount.style.color = '#dc3545';
                } else if (currentLength > 2500) {
                    charCount.style.color = '#ffc107';
                } else {
                    charCount.style.color = '#666';
                }
                
                // Atualizar preview
                if (this.value.trim()) {
                    preview.style.display = 'block';
                    previewContent.textContent = this.value;
                } else {
                    preview.style.display = 'none';
                }
            });
            
            // Enviar formulário
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Validar se há texto
                const postText = postTextarea.value.trim();
                if (!postText) {
                    showStatus('❌ Por favor, digite o texto do post.', 'error');
                    return;
                }
                
                // Desabilitar botão e mostrar loading
                enviarBtn.disabled = true;
                enviarBtn.innerHTML = '<span class="loading"></span> Enviando...';
                
                // Preparar dados para envio
                const data = {
                    text: postText,
                    timestamp: new Date().toISOString(),
                    source: 'linkedin-post-generator'
                };
                
                try {
                    console.log('📤 Enviando post para o webhook:', data);
                    
                    // Enviar para o webhook
                    const response = await fetch('https://webhook.oprograma.com/webhook/linkedin', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data)
                    });
                    
                    let result;
                    try {
                        result = await response.json();
                    } catch (e) {
                        result = { message: response.statusText };
                    }
                    
                    if (response.ok) {
                        showStatus('✅ Post enviado com sucesso! O n8n irá publicar no seu LinkedIn em breve.', 'success');
                        console.log('✅ Sucesso:', result);
                        
                        // Limpar formulário
                        form.reset();
                        charCount.textContent = '0';
                        charCount.style.color = '#666';
                        preview.style.display = 'none';
                    } else {
                        throw new Error(result.message || 'Erro ao enviar post');
                    }
                    
                } catch (error) {
                    console.error('❌ Erro ao enviar:', error);
                    showStatus(`❌ Erro ao enviar: ${error.message}`, 'error');
                } finally {
                    // Reabilitar botão
                    setTimeout(() => {
                        enviarBtn.disabled = false;
                        enviarBtn.innerHTML = 'Enviar para LinkedIn';
                    }, 2000);
                }
            });
            
            // Função para mostrar status
            function showStatus(message, type) {
                statusDiv.textContent = message;
                statusDiv.className = `status ${type}`;
                statusDiv.style.display = 'block';
                
                // Esconder mensagem após 5 segundos para sucesso, 10 para erro
                const timeout = type === 'success' ? 5000 : 10000;
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, timeout);
            }
            
            // Auto-resize do textarea
            postTextarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = this.scrollHeight + 'px';
            });
        });
    </script>
</body>
</html>
